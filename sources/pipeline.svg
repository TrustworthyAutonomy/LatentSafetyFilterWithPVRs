<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" role="img" aria-label="Pipeline from image observation to safe control">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d57a5"/>
    </marker>
    <style>
      .box { fill: #f4f7fc; stroke: #2d57a5; stroke-width: 2; }
      .box2 { fill: #eef8f0; stroke: #1f7a3f; stroke-width: 2; }
      .box3 { fill: #fff6e8; stroke: #b36b00; stroke-width: 2; }
      .t { font-family: 'Source Sans Pro', Arial, sans-serif; fill: #222; text-anchor: middle; }
      .h { font-size: 18px; font-weight: 700; }
      .s { font-size: 13px; fill: #555; }
      .lab { font-size: 12px; fill: #2d57a5; font-weight: 600; }
    </style>
  </defs>

  <rect x="20" y="90" width="150" height="90" rx="12" class="box"/>
  <text x="95" y="128" class="t h">RGB image</text>
  <text x="95" y="152" class="t s">observation o_t</text>

  <line x1="170" y1="135" x2="210" y2="135" stroke="#2d57a5" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="70" width="180" height="130" rx="12" class="box"/>
  <text x="300" y="108" class="t h">PVR backbone</text>
  <text x="300" y="132" class="t s">DINO / VC-1 / R3M</text>
  <text x="300" y="154" class="t s">ResNet / Scratch</text>
  <text x="300" y="176" class="t s">frozen or fine-tuned</text>

  <line x1="390" y1="135" x2="430" y2="135" stroke="#2d57a5" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="430" y="40" width="200" height="80" rx="12" class="box3"/>
  <text x="530" y="72" class="t h">Failure classifier</text>
  <text x="530" y="96" class="t s">latent unsafe set F</text>

  <rect x="430" y="145" width="200" height="95" rx="12" class="box2"/>
  <text x="530" y="180" class="t h">HJ safety filter</text>
  <text x="530" y="204" class="t s">Q / V in latent space</text>
  <text x="530" y="224" class="t s">+ optional world model</text>

  <line x1="630" y1="80" x2="690" y2="120" stroke="#2d57a5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="190" x2="690" y2="150" stroke="#2d57a5" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="690" y="85" width="250" height="100" rx="12" class="box"/>
  <text x="815" y="122" class="t h">Safe switching</text>
  <text x="815" y="146" class="t s">critic-only or dynamics</text>
  <text x="815" y="168" class="t s">lookahead ’ À_safe / À_nom</text>

  <text x="95" y="250" class="t lab">Observation</text>
  <text x="300" y="250" class="t lab">Perception</text>
  <text x="530" y="250" class="t lab">Safety models</text>
  <text x="815" y="250" class="t lab">Closed-loop control</text>
</svg>
